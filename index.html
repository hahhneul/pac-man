<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="외부 라이브러리 없이 Canvas로 만든 네온 미로 추격 아케이드 게임"
    />
    <title>NEON MAZE — Arcade Chase</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell" aria-labelledby="game-title">
      <h1 id="game-title" class="sr-only">NEON MAZE</h1>

      <header class="hud" aria-label="게임 현황">
        <div class="hud-stat">
          <span id="scoreLabel" class="hud-label">SCORE</span>
          <output id="scoreValue" class="hud-value" aria-labelledby="scoreLabel" aria-live="off">000000</output>
        </div>
        <div class="hud-stat hud-stat--center">
          <span id="highScoreLabel" class="hud-label">HIGH SCORE</span>
          <output
            id="highScoreValue"
            class="hud-value hud-value--high"
            aria-labelledby="highScoreLabel"
            aria-live="off"
          >000000</output>
        </div>
        <div class="hud-stat hud-stat--right">
          <span id="levelLabel" class="hud-label">LEVEL</span>
          <output id="levelValue" class="hud-value" aria-labelledby="levelLabel" aria-live="off">01</output>
        </div>
      </header>

      <section class="board-frame" aria-label="게임 영역">
        <canvas
          id="gameCanvas"
          width="456"
          height="552"
          tabindex="0"
          aria-label="네온 미로 추격 게임 보드. 방향키 또는 WASD로 이동합니다."
          aria-describedby="canvasInstructions"
        >
          이 게임을 실행하려면 HTML Canvas를 지원하는 브라우저가 필요합니다.
        </canvas>
        <p id="canvasInstructions" class="sr-only">
          작은 빛 점을 모두 모으고 네 모서리의 큰 에너지 볼로 추격자를 일시적으로 무력화하세요.
          현재 점수, 최고 점수, 레벨과 목숨은 게임 보드 위아래에 표시됩니다.
        </p>

        <div
          id="gameOverlay"
          class="game-overlay"
          role="group"
          aria-labelledby="overlayTitle"
          aria-describedby="overlayDetail"
        >
          <div class="overlay-panel">
            <p id="overlayKicker" class="overlay-kicker">NEON MAZE // READY</p>
            <p id="overlayTitle" class="overlay-title">PRESS ENTER TO START</p>
            <p id="overlayDetail" class="overlay-detail">ARROW KEYS / WASD</p>
            <button id="overlayAction" class="overlay-action" type="button">START</button>
          </div>
        </div>
      </section>

      <section class="game-status" aria-label="남은 목숨과 조작 도움말">
        <div class="lives-wrap">
          <span class="status-label">LIVES</span>
          <div id="livesValue" class="lives" role="img" aria-label="남은 목숨 3개"></div>
        </div>
        <p class="key-help"><kbd>P</kbd> PAUSE <span aria-hidden="true">·</span> <kbd>R</kbd> RESTART</p>
      </section>

      <section class="touch-panel" aria-label="터치 조작">
        <div class="touch-actions">
          <button id="pauseButton" class="utility-button" type="button" aria-label="게임 일시정지">
            PAUSE
          </button>
          <button id="restartButton" class="utility-button" type="button" aria-label="게임 재시작">
            RESTART
          </button>
        </div>

        <div class="dpad" aria-label="방향 버튼">
          <button class="direction-button direction-button--up" type="button" data-direction="up" aria-label="위로 이동">
            <span aria-hidden="true">▲</span>
          </button>
          <button class="direction-button direction-button--left" type="button" data-direction="left" aria-label="왼쪽으로 이동">
            <span aria-hidden="true">◀</span>
          </button>
          <div class="dpad-center" aria-hidden="true"></div>
          <button class="direction-button direction-button--right" type="button" data-direction="right" aria-label="오른쪽으로 이동">
            <span aria-hidden="true">▶</span>
          </button>
          <button class="direction-button direction-button--down" type="button" data-direction="down" aria-label="아래로 이동">
            <span aria-hidden="true">▼</span>
          </button>
        </div>
      </section>

      <p id="gameAnnouncement" class="sr-only" aria-live="polite"></p>
    </main>

    <script src="game.js" defer></script>
  </body>
</html>
